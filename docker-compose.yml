version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dhcpuser
      POSTGRES_PASSWORD: dhcppass
      POSTGRES_DB: dhcpdb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: dhcpuser
      DATABASE_PASSWORD: dhcppass
      DATABASE_NAME: dhcpdb
    depends_on:
      - db
    ports:
      - "5000:5000"
    command: npm run start:prod
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    env_file:
      - ./frontend/.env

volumes:
  db-data:
